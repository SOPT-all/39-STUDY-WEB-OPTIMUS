name: PR Review Remind

on:
  schedule:
    # cron 은 항상 UTC 기준. KST(UTC+9, 서머타임 없음) 평일 10:00 = UTC 01:00 월~금
    # 정시는 GitHub 부하로 수 분~수십 분 지연될 수 있음 (정확한 시각 보장 X)
    - cron: '0 1 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Discord 전송 없이 Job Summary 에만 출력'
        type: boolean
        default: true

# 수동 실행과 스케줄이 겹쳐도 중복 알림이 나가지 않도록 직렬화
concurrency:
  group: pr-review-remind
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print run context
        run: |
          # schedule 은 UTC 기준으로 실행되므로 실제 실행 시각을 UTC/KST 둘 다 확인
          echo "event: ${{ github.event_name }}"
          echo "utc  : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "kst  : $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')"