name: PR Review Remind

on:
  schedule:
    # cron 은 항상 UTC 기준. KST(UTC+9, 서머타임 없음) 평일 10:00 = UTC 01:00 월~금
    # 정시는 GitHub 부하로 수 분~수십 분 지연될 수 있음 (정확한 시각 보장 X)
    - cron: '0 1 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Discord 전송 없이 Job Summary 에만 출력'
        type: boolean
        default: true
  # 스터디 규칙(auto/* -> test 머지 후 동작 확인)용: test 에 머지되면 즉시 1회 실행
  push:
    branches: [test]
    paths: ['.github/workflows/pr-review-remind.yml']

# 수동 실행과 스케줄이 겹쳐도 중복 알림이 나가지 않도록 직렬화
concurrency:
  group: pr-review-remind
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  MIN_AGE_HOURS: '12'                 # 생성 후 N시간 미만 PR 제외
  MIN_STALE_HOURS: '6'                # 마지막 활동 후 N시간 미만 PR 제외 (방금 업데이트된 PR 재촉 방지)
  REQUIRED_APPROVALS: '1'             # 승인 기준 수 (최소 1)
  REMIND_APPROVED: 'true'             # 승인 완료 PR 머지 독촉 여부
  IGNORED_LABELS: 'WIP,no-remind,on-hold'
  IGNORED_TERMS: '[WIP],DO NOT MERGE' # 제목에 포함 시 제외 (대소문자 무시)
  MAX_ITEMS: '20'                     # 메시지 과대 방지용 최대 표시 개수
  BOT_NAME: 'PR Reminder'

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 수동 실행은 dry_run 을 끈 경우에만, 그 외(schedule/push)는 항상 실제 전송
    # (non-dispatch 이벤트에서 inputs.dry_run 은 null 이라 이벤트 종류로 명시 분기)
    env:
      SHOULD_SEND: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
    steps:
      - name: Validate secrets
        if: env.SHOULD_SEND == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # 무인 실행에서 시크릿 누락/오타로 인한 silent failure 방지
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::error::DISCORD_WEBHOOK secret is not set"
            exit 1
          fi
          # Slack 호환 엔드포인트(/slack)나 잘못된 URL 이면 embed payload 가 거부됨
          if ! echo "$DISCORD_WEBHOOK" | grep -Eq '^https://((ptb|canary)\.)?discord(app)?\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]+/?$'; then
            echo "::error::DISCORD_WEBHOOK 형식이 올바르지 않음 (https://discord.com/api/webhooks/<id>/<token>, 끝에 /slack 금지)"
            exit 1
          fi

      - name: Collect PRs and build Discord payload
        id: collect
        uses: actions/github-script@v7
        env:
          DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP || vars.DISCORD_USER_MAP }}
        with:
          script: |
            const HOUR = 3600 * 1000;
            const now = Date.now();

            // 빈 문자열/음수/NaN 은 기본값으로 대체 (Number('') === 0 함정 회피)
            const num = (k, d) => {
              const raw = process.env[k];
              const v = Number(raw);
              return raw !== undefined && raw.trim() !== '' && Number.isFinite(v) && v >= 0 ? v : d;
            };
            const list = (k) => (process.env[k] || '')
              .split(',').map((s) => s.trim().toLowerCase()).filter(Boolean);

            const minAge = num('MIN_AGE_HOURS', 0) * HOUR;
            const minStale = num('MIN_STALE_HOURS', 0) * HOUR;
            const reqApprovals = Math.max(1, Math.floor(num('REQUIRED_APPROVALS', 1)));
            const remindApproved = (process.env.REMIND_APPROVED || 'true').toLowerCase() === 'true';
            const maxItems = Math.max(1, Math.floor(num('MAX_ITEMS', 20)));
            const ignoredLabels = new Set(list('IGNORED_LABELS'));
            const ignoredTerms = list('IGNORED_TERMS');

            // GitHub ID(대소문자 무시) -> Discord snowflake ID. 형식이 틀린 값은 경고 후 무시
            const userMap = {};
            try {
              const parsed = JSON.parse(process.env.DISCORD_USER_MAP || '{}');
              if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
                for (const [k, v] of Object.entries(parsed)) {
                  const id = String(v).trim();
                  if (/^\d{17,20}$/.test(id)) userMap[k.toLowerCase()] = id;
                  else core.warning(`DISCORD_USER_MAP: ${k} 의 ID 형식 오류 (${id}) -> 무시`);
                }
              }
            } catch {
              core.warning('DISCORD_USER_MAP JSON 파싱 실패: 멘션 없이 진행');
            }

            // 멘션은 sink 에 ID 를 모았다가, 실제로 메시지에 포함된 줄의 ID 만 content 핑 대상으로 확정
            const mention = (login, sink) => {
              const id = userMap[login.toLowerCase()];
              if (id) { sink.add(id); return `<@${id}>`; }
              return `\`@${login}\``;
            };
            // Discord 마크다운 제어문자 이스케이프 (링크 텍스트 깨짐, 서식 주입 방지)
            const esc = (s) => s.replace(/[\r\n]+/g, ' ').replace(/[\\`*_~|<>\[\]()]/g, '\\$&');
            const clip = (s, n) => (s.length > n ? `${s.slice(0, n - 1)}…` : s);
            const ago = (ms) => {
              const h = Math.max(0, Math.floor(ms / HOUR));
              return h >= 48 ? `${Math.floor(h / 24)}일` : `${h}시간`;
            };

            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });

            // 1차 필터: 추가 API 호출 없이 판별 가능한 조건 먼저 적용 (rate limit 절약)
            const candidates = prs.filter((pr) => {
              if (pr.draft) return false;
              if (now - Date.parse(pr.created_at) < minAge) return false;
              if (now - Date.parse(pr.updated_at) < minStale) return false;
              if (pr.labels.some((l) => ignoredLabels.has((l.name || '').toLowerCase()))) return false;
              const title = pr.title.toLowerCase();
              if (ignoredTerms.some((t) => title.includes(t))) return false;
              return true;
            });

            // 2차 필터: 리뷰 상태 조회 (PR 단위 병렬)
            const classified = await Promise.all(candidates.map(async (pr) => {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });

              // 리뷰어별 최신 "결정" 상태만 유지 (시간순 정렬된 응답)
              // COMMENTED/PENDING 은 이전 결정을 덮어쓰지 않음, DISMISSED 는 결정 무효화
              const latest = new Map();
              for (const r of reviews) {
                const login = r.user?.login;
                if (!login || login === pr.user.login) continue;
                if (r.state === 'APPROVED' || r.state === 'CHANGES_REQUESTED') latest.set(login, r.state);
                else if (r.state === 'DISMISSED') latest.delete(login);
              }

              const approvals = [...latest.values()].filter((s) => s === 'APPROVED').length;
              const pendingUsers = (pr.requested_reviewers || []).map((u) => u.login);
              const pendingTeams = (pr.requested_teams || []).map((t) => t.slug);
              const pendingSet = new Set(pendingUsers);
              // 재요청되지 않은 변경요청 = 작성자가 아직 반영해야 하는 상태
              const unresolved = [...latest]
                .filter(([u, s]) => s === 'CHANGES_REQUESTED' && !pendingSet.has(u))
                .map(([u]) => u);

              const base = {
                number: pr.number,
                title: pr.title,
                url: pr.html_url,
                author: pr.user.login,
                createdAt: Date.parse(pr.created_at),
              };

              // 우선순위: 리뷰 대기 > 변경 요청 > 승인 완료 > 미지정
              if (pendingUsers.length || pendingTeams.length) {
                return { ...base, type: 'review', pendingUsers, pendingTeams };
              }
              if (unresolved.length) return { ...base, type: 'changes', requesters: unresolved };
              if (approvals >= reqApprovals) return remindApproved ? { ...base, type: 'merge', approvals } : null;
              return { ...base, type: 'unassigned' };
            }));

            const buckets = { review: [], changes: [], merge: [], unassigned: [] };
            for (const item of classified) if (item) buckets[item.type].push(item);
            // 오래된 PR 이 먼저 보이도록 정렬
            for (const b of Object.values(buckets)) b.sort((a, z) => a.createdAt - z.createdAt);
            const total = Object.values(buckets).reduce((n, b) => n + b.length, 0);

            const kst = new Date(now + 9 * HOUR);
            const heading = `PR 리뷰 리마인드 | ${kst.toISOString().slice(0, 10)} (${'일월화수목금토'[kst.getUTCDay()]}) | ${total}건`;

            core.setOutput('count', String(total));
            core.setOutput('has_targets', String(total > 0));

            if (!total) {
              core.info('리마인드 대상 PR 없음 -> 알림 생략');
              await core.summary.addHeading('PR Review Remind').addRaw('리마인드 대상 PR 없음').write();
              return;
            }

            // [key, 섹션명, embed 색상, 줄 꼬리 포맷터]
            const SECTIONS = [
              ['review', '리뷰 대기', 0xF2C744, (r, s) =>
                `리뷰어: ${[...r.pendingUsers.map((u) => mention(u, s)), ...r.pendingTeams.map((t) => `\`@${t}\``)].join(' ')}`],
              ['changes', '변경 요청 반영 대기', 0xE67E22, (r, s) =>
                `작성자: ${mention(r.author, s)} | 요청: ${r.requesters.map((u) => `\`@${u}\``).join(' ')}`],
              ['merge', '승인 완료, 머지 대기', 0x2ECC71, (r, s) =>
                `작성자: ${mention(r.author, s)} | 승인 ${r.approvals}`],
              ['unassigned', '리뷰어 미지정', 0x95A5A6, (r, s) =>
                `작성자: ${mention(r.author, s)} | 리뷰어를 지정해주세요`],
            ];

            // Discord 제한: description 4096 / embed 총합 6000 -> 안내문 여유분 두고 보수적으로 계산
            const DESC_LIMIT = 4096 - 32;
            const TOTAL_LIMIT = 6000 - 200;
            const footer = `${owner}/${repo}`;
            const timestamp = new Date(now).toISOString();
            const mentioned = new Set();
            const embeds = [];
            let totalChars = 0;
            let budget = maxItems;

            for (const [key, label, color, fmt] of SECTIONS) {
              const items = buckets[key];
              if (!items.length) continue;
              const title = `[${label}] ${items.length}건`;
              const lines = [];
              let descLen = 0;
              let shown = 0;
              for (const r of items) {
                if (budget <= 0) break;
                const sink = new Set();
                const line = `• [#${r.number} ${esc(clip(r.title, 80))}](${r.url}) | ${ago(now - r.createdAt)} 경과 | ${fmt(r, sink)}`;
                const nextDesc = descLen + line.length + 1;
                if (nextDesc > DESC_LIMIT || totalChars + title.length + footer.length + nextDesc > TOTAL_LIMIT) break;
                lines.push(line);
                descLen = nextDesc;
                shown += 1;
                budget -= 1;
                sink.forEach((id) => mentioned.add(id)); // 실제 포함된 줄의 멘션만 핑
              }
              if (shown < items.length) lines.push(`외 ${items.length - shown}건`);
              const description = lines.join('\n');
              totalChars += title.length + footer.length + description.length;
              embeds.push({ title, description, color, footer: { text: footer }, timestamp });
            }

            // embed 내부 멘션은 알림이 안 가므로 content 에 핑 대상을 모음 (2000자 / 100명 제한)
            const ids = [...mentioned].slice(0, 80);
            const content = [`**${heading}**`, ids.map((id) => `<@${id}>`).join(' ')].filter(Boolean).join('\n');

            const payload = {
              username: process.env.BOT_NAME || 'PR Reminder',
              content,
              embeds,
              allowed_mentions: { parse: [], users: ids }, // 매핑된 유저만 핑 허용
            };

            core.setOutput('payload', JSON.stringify(payload));
            await core.summary
              .addHeading('PR Review Remind')
              .addRaw(`${heading}\n`)
              .addCodeBlock(JSON.stringify(payload, null, 2), 'json')
              .write();

      - name: Notify Discord
        if: env.SHOULD_SEND == 'true' && steps.collect.outputs.has_targets == 'true'
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PAYLOAD: ${{ steps.collect.outputs.payload }}
        with:
          script: |
            const base = process.env.DISCORD_WEBHOOK.trim().replace(/\/+$/, '');
            // wait=true: 실패 시 Discord 가 에러 본문을 반환해서 원인 파악 가능
            const url = `${base}?wait=true`;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            const MAX_ATTEMPTS = 3;

            for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt += 1) {
              const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: process.env.PAYLOAD,
              });
              if (res.ok) {
                core.info(`Discord 전송 완료 (HTTP ${res.status})`);
                return;
              }
              const body = await res.text();
              const last = attempt === MAX_ATTEMPTS;
              // 429: retry_after(초) 만큼 대기, 5xx: 지수 백오프. 4xx(payload 오류)는 재시도 무의미
              if (!last && res.status === 429) {
                let wait = 1;
                try { wait = Number(JSON.parse(body).retry_after) || 1; } catch {}
                core.warning(`Rate limited -> ${wait}s 후 재시도 (${attempt}/${MAX_ATTEMPTS})`);
                await sleep(Math.min(wait, 30) * 1000 + 250);
                continue;
              }
              if (!last && res.status >= 500) {
                await sleep(2000 * attempt);
                continue;
              }
              core.setFailed(`Discord 전송 실패 (HTTP ${res.status}): ${body.slice(0, 500)}`);
              return;
            }

      - name: Notify failure
        if: failure() && env.SHOULD_SEND == 'true'
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          script: |
            const hook = (process.env.DISCORD_WEBHOOK || '').trim().replace(/\/+$/, '');
            if (!hook) return; // 시크릿 자체가 없으면 보낼 곳이 없음
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await fetch(hook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                username: process.env.BOT_NAME || 'PR Reminder',
                embeds: [{ title: 'PR 리마인드 워크플로 실패', url: runUrl, description: runUrl, color: 0xE74C3C }],
                allowed_mentions: { parse: [] },
              }),
            }).catch((e) => core.warning(`실패 알림 전송 불가: ${e.message}`));